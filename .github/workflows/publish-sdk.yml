# Publishes the Python SDK (sdk/) to PyPI when a tag like sdk-v0.1.0 is pushed.
#
# Uses PyPI trusted publishing: no API token is stored. PyPI and TestPyPI each have a
# publisher configured for this repository, this workflow file and the environment named
# in the publish jobs below, so those names must not change without updating PyPI too.
#
# Release: bump `version` in sdk/pyproject.toml, commit, then
#   git tag sdk-vX.Y.Z && git push origin sdk-vX.Y.Z

name: Publish SDK

on:
  push:
    tags: ["sdk-v*"]

permissions:
  contents: read

jobs:
  test-sdk:
    name: SDK tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: pip install ./sdk pytest respx
      # tests/conftest.py imports the server, which needs Python 3.12+.
      - run: pytest --noconftest -p no:cacheprovider -W ignore::pytest.PytestConfigWarning tests/test_sdk_client.py

  test-all:
    name: Full test suite (incl. SDK/server parity)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]" -e ./sdk
      - run: pytest

  build:
    needs: [test-sdk, test-all]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check the tag matches the package version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('sdk/pyproject.toml', 'rb'))['project']['version'])")
          if [ "$GITHUB_REF_NAME" != "sdk-v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match sdk/pyproject.toml version $version"
            exit 1
          fi
      - run: pip install build twine
      - run: python -m build sdk --outdir dist
      - run: twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: sdk-dist
          path: dist/

  publish-testpypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/flagstone-sdk
    permissions:
      id-token: write  # lets this job prove its identity to PyPI; only publish jobs get it
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sdk-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    needs: publish-testpypi
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/flagstone-sdk
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sdk-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
