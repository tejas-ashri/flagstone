[build-system]
# 77+ for the SPDX `license` expression and `license-files`.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "flagstone-sdk"
version = "0.1.0"
description = "Python SDK for Flagstone feature flags: local flag evaluation, percentage rollouts and A/B experiment events."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Tejas Ashri" }]
requires-python = ">=3.10"
dependencies = ["httpx>=0.27"]
keywords = ["feature flags", "feature toggles", "a/b testing", "experiments", "rollout"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
flagstone_sdk = ["py.typed"]
